[package]
name = "sessionpal"
version = "0.5.0"
description = "A local-first desktop library for AI coding agent sessions."
authors = ["Subhojit Karmakar"]
homepage = "https://sessionpal.app"
repository = "https://github.com/essjaykay755/sessionpal"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sessionpal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
trash = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
